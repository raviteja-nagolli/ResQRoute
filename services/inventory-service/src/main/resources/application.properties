spring.application.name=inventory-service
spring.datasource.url=${INVENTORY_DB_URL}
spring.datasource.username=${INVENTORY_DB_USERNAME}
spring.datasource.password=${INVENTORY_DB_PASSWORD}
spring.jpa.show_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8084
spring.kafka.bootstraps-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{X-Correlation-ID}] %logger{36} : %msg%n

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.inventory_service.event
spring.kafka.consumer.properties[spring.json.use.type.headers]=true

spring.kafka.producer.properties[spring.json.type.mapping]=inventoryReserved:com.example.inventory_service.event.InventoryReservedEvent,inventoryFailed:com.example.inventory_service.event.InventoryFailedEvent
spring.kafka.consumer.properties[spring.json.type.mapping]=orderCreated:com.example.inventory_service.event.OrderCreatedEvent,orderCancelled:com.example.inventory_service.event.OrderCancelledEvent
