spring.application.name=product-service
spring.datasource.url=${PRODUCT_DB_URL}
spring.datasource.username=${PRODUCT_DB_USERNAME}
spring.datasource.password=${PRODUCT_DB_PASSWORD}
spring.jpa.show_sql=true
spring.jpa.hibernate.ddl-auto=update
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
server.port=8081

logging.level.root=INFO
logging.level.com.example.product_service=DEBUG

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{X-Correlation-ID}] %logger{36} : %msg%n