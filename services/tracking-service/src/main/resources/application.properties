spring.application.name=tracking-service
spring.datasource.url=${TRACKING_DB_URL}
spring.datasource.username=${TRACKING_DB_USERNAME}
spring.datasource.password=${TRACKING_DB_PASSWORD}
spring.jpa.show_sql=true
spring.jpa.hibernate.properties.show_sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8085
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{X-Correlation-ID}] %logger{36} : %msg%n

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.inventory_service.event
spring.kafka.consumer.properties[spring.json.use.type.headers]=true

spring.kafka.consumer.properties[spring.json.type.mapping]=inventoryReserved:com.example.tracking_service.event.InventoryReservedEvent, inventoryFailed:com.example.tracking_service.event.InventoryFailedEvent, orderCreated:com.example.tracking_service.event.OrderCreatedEvent, orderCancelled:com.example.tracking_service.event.OrderCancelledEvent, orderUpdated:com.example.tracking_service.event.OrderUpdatedEvent