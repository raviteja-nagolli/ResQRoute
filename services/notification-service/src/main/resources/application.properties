spring.application.name=notification-service
spring.datasource.url=${NOTIFICATION_DB_URL}
spring.datasource.username=${NOTIFICATION_DB_USERNAME}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}
spring.jpa.show_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8083
spring.kafka.bootstraps-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{X-Correlation-ID}] %logger{36} : %msg%n

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.notification_service.event
spring.kafka.consumer.properties[spring.json.use.type.headers]=true

spring.kafka.consumer.properties[spring.json.type.mapping]=orderCreated:com.example.notification_service.event.OrderCreatedEvent, orderCancelled:com.example.notification_service.event.OrderCancelledEvent, orderUpdated:com.example.notification_service.event.OrderUpdatedEvent